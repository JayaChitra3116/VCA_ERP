<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C" />
      <stop offset="50%" stop-color="#C59239" />
      <stop offset="100%" stop-color="#93621A" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="towelTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF0E6" />
      <stop offset="100%" stop-color="#E6D5B8" />
    </linearGradient>
    <linearGradient id="towelBottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF0E6" />
      <stop offset="60%" stop-color="#EEDC82" />
      <stop offset="100%" stop-color="#C59239" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="vca-symbol-logo" filter="url(#shadow)">
    <!-- Outer Golden Crescent Arc Swoosh -->
    <path d="M 185 110 C 95 130 50 230 90 325 C 130 415 235 445 335 415 C 230 450 105 395 75 300 C 45 205 105 125 185 110 Z" fill="url(#goldGrad)" />
    
    <!-- Outer Dark Navy Crescent Swoosh -->
    <path d="M 205 390 C 285 425 390 395 450 310 C 475 260 465 185 450 150 C 463 200 453 280 385 348 C 320 412 230 405 205 390 Z" fill="url(#navyGrad)" />

    <!-- Top Cotton Boll Golden Outline Emblem -->
    <g transform="translate(250, 140)">
      <!-- Golden Cotton Boll 3-Lobe Cloud Contour -->
      <path d="M -52 18 C -78 -8 -62 -62 -26 -68 C -16 -95 16 -95 26 -68 C 62 -62 78 -8 52 18 C 36 38 -36 38 -52 18 Z" 
            fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Inside Navy 3-Petal Leaf Symbol -->
      <!-- Center Leaf -->
      <path d="M 0 20 C -15 -10 -12 -45 0 -58 C 12 -45 15 -10 0 20 Z" fill="url(#navyGrad)" />
      <!-- Left Leaf -->
      <path d="M -6 16 C -30 8 -48 -15 -44 -40 C -28 -35 -10 -15 -6 16 Z" fill="url(#navyGrad)" />
      <!-- Right Leaf -->
      <path d="M 6 16 C 30 8 48 -15 44 -40 C 28 -35 10 -15 6 16 Z" fill="url(#navyGrad)" />
    </g>

    <!-- Stacked Folded Towels (Center) -->
    <!-- TOP FOLDED TOWEL -->
    <g transform="translate(130, 222)">
      <!-- Towel Outer Shape Fill -->
      <path d="M 30 0 L 190 0 C 215 0 228 18 218 36 C 208 52 185 52 170 52 L 30 52 C 10 52 0 40 0 26 C 0 12 10 0 30 0 Z" 
            fill="url(#towelTopGrad)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />
      
      <!-- Right Fold Layer Curvature -->
      <path d="M 185 0 C 210 0 226 15 226 26 C 226 37 210 52 185 52 M 172 0 C 197 0 213 15 213 26 C 213 37 197 52 172 52" 
            fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
      
      <!-- Subtle Engraved Towel Grain Texture Lines -->
      <path d="M 35 12 L 170 12 M 32 24 L 175 24 M 35 36 L 170 36 M 38 44 L 165 44" 
            fill="none" stroke="#C59239" stroke-width="2" stroke-dasharray="8 4" opacity="0.65" />
    </g>

    <!-- BOTTOM FOLDED TOWEL -->
    <g transform="translate(125, 285)">
      <!-- Towel Outer Shape Fill -->
      <path d="M 30 0 L 190 0 C 215 0 228 18 218 36 C 208 52 185 52 170 52 L 30 52 C 10 52 0 40 0 26 C 0 12 10 0 30 0 Z" 
            fill="url(#towelBottomGrad)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

      <!-- Right Fold Layer Curvature -->
      <path d="M 185 0 C 210 0 226 15 226 26 C 226 37 210 52 185 52 M 172 0 C 197 0 213 15 213 26 C 213 37 197 52 172 52" 
            fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

      <!-- Subtle Engraved Towel Grain Texture Lines -->
      <path d="M 35 12 L 170 12 M 32 24 L 175 24 M 35 36 L 170 36 M 38 44 L 165 44" 
            fill="none" stroke="#93621A" stroke-width="2" stroke-dasharray="8 4" opacity="0.65" />
    </g>
  </g>
</svg>
